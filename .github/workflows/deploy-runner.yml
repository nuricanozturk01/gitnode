name: Deploy | GitNode Runner

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g. 1.0.0)'
        required: true

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Repsy
        uses: docker/login-action@v3
        with:
          registry: repo.repsy.io
          username: ${{ secrets.REPSY_USERNAME }}
          password: ${{ secrets.REPSY_PASSWORD }}

      - name: Build and push Runner
        uses: docker/build-push-action@v6
        with:
          context: gitnode-runner
          push: true
          platforms: linux/amd64
          tags: |
            repo.repsy.io/nuricanozturk/gitnode-runner/gitnode-runner:${{ inputs.version }}
            repo.repsy.io/nuricanozturk/gitnode-runner/gitnode-runner:latest
