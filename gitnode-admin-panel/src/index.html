<!doctype html>
<html lang="en" data-theme="gitnode">
  <head>
    <meta charset="utf-8" />
    <script>
      (function () {
        var preference = 'system';
        try {
          preference = localStorage.getItem('gitnode-theme') || localStorage.getItem('gitnode-admin-theme') || 'system';
        } catch (e) {
          // Use the system preference when storage is unavailable.
        }
        var dark =
          preference === 'gitnode' ||
          (preference !== 'gitnode-light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'gitnode' : 'gitnode-light');
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
    <title>GitNode Admin</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" sizes="32x32" href="/gitnode-mark-32.png" />
    <link rel="icon" type="image/svg+xml" href="/gitnode-mark.svg" />
    <link rel="apple-touch-icon" href="/gitnode-mark-180.png" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
