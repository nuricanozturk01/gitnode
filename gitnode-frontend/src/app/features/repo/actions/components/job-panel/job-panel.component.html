<ul class="space-y-0.5 p-2" aria-label="Jobs">
  @for (job of jobs(); track job.id) {
    <li>
      <button
        type="button"
        class="hover:bg-base-200/60 flex w-full items-center gap-2 rounded-md px-3 py-2 text-left text-sm"
        [class.bg-base-200]="selectedJobId() === job.id"
        [class.font-semibold]="selectedJobId() === job.id"
        [attr.aria-current]="selectedJobId() === job.id ? 'true' : null"
        (click)="selectJob(job.id)"
      >
        <lucide-icon
          [name]="statusIconName(job.status, job.conclusion)"
          class="size-4 shrink-0"
          [class]="statusIconClass(displayStatus(job))"
          [class.animate-spin]="statusIconSpinning(job.status, job.conclusion)"
        ></lucide-icon>
        <span class="min-w-0 flex-1 truncate">{{ job.name }}</span>
        @if (duration(job)) {
          <span class="text-base-content/50 shrink-0 text-xs">{{ duration(job) }}</span>
        }
      </button>
    </li>
  }
</ul>
